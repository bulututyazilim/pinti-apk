<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinti - APK testi</title>
<style>
  body { font-family: sans-serif; margin: 16px; line-height: 1.5; background: #fbf7ee; color: #2b2417; }
  h1 { margin: 0 0 4px; }
  button { font-size: 18px; padding: 12px 20px; margin: 8px 8px 8px 0; border: 0; border-radius: 10px; background: #e8a317; font-weight: 700; }
  input { font-size: 18px; padding: 10px; width: 55%; }
  .satir { padding: 10px; margin: 8px 0; background: #fff; border: 1px solid #eadfc6; border-radius: 8px; }
  .satir small { color: #666; display: block; }
  #durum { padding: 8px; border-radius: 8px; margin: 8px 0; }
  .iyi { background: #d9f2e3; } .kotu { background: #fde0dc; }
</style>
</head>
<body>
  <h1>Pinti - APK testi 🐷</h1>
  <div id="durum"></div>
  <p>Aranacak kelime:</p>
  <input id="q" value="telefon"> <br>
  <button id="dugme">Test et</button>
  <button id="kopyala">Sonucu kopyala</button>
  <div id="sonuc"></div>

<script>
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const durum = document.getElementById("durum");
  durum.className = native ? "iyi" : "kotu";
  durum.textContent = native
    ? "✅ Uygulama içinde çalışıyor: istekler telefonundan çıkacak."
    : "⚠️ Bu sayfa tarayıcıda açık. Test sadece APK içinde anlamlı, tarayıcı diğer siteleri okuyamaz.";

  const UA = "Mozilla/5.0 (Linux; Android 10; SM-A305F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36";
  const FIYAT = /\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?\s?(?:TL|₺)/g;
  const SITELER = (q) => [
    ["Trendyol", `https://www.trendyol.com/sr?q=${q}`],
    ["Hepsiburada", `https://www.hepsiburada.com/ara?q=${q}`],
    ["N11", `https://www.n11.com/arama?q=${q}`],
    ["Amazon TR", `https://www.amazon.com.tr/s?k=${q}`],
    ["Vatan", `https://www.vatanbilgisayar.com/arama/${q}/`],
    ["Teknosa", `https://www.teknosa.com/arama/?s=${q}`],
    ["MediaMarkt", `https://www.mediamarkt.com.tr/tr/search.html?query=${q}`],
    ["İncehesap", `https://www.incehesap.com/arama/?q=${q}`],
    ["İtopya", `https://www.itopya.com/arama/?q=${q}`],
    ["PttAVM", `https://www.pttavm.com/arama?q=${q}`],
    ["Çiçeksepeti", `https://www.ciceksepeti.com/arama?query=${q}`],
    ["Pazarama", `https://www.pazarama.com/arama?q=${q}`],
  ];
  const simge = { UYGUN: "✅", GIRDI_FIYAT_YOK: "🟡", ENGELLI: "❌", HATA: "⚠️", BEKLIYOR: "⏳" };
  let ozet = "";

  const zamanAsimi = (p, ms) =>
    Promise.race([p, new Promise((_, red) => setTimeout(() => red(new Error("zaman aşımı")), ms))]);

  async function dene(ad, url) {
    try {
      const r = await zamanAsimi(fetch(url, { headers: { "User-Agent": UA, "Accept-Language": "tr-TR,tr;q=0.9", Accept: "text/html,application/xhtml+xml,*/*;q=0.8" } }), 20000);
      const metin = await r.text();
      const baslik = ((metin.match(/<title[^>]*>([^<]*)<\/title>/i) || [])[1] || "").trim().slice(0, 60);
      const engel = /just a moment|attention required|access denied|captcha|üzgünüz/i.test(baslik) || /cf-challenge|_cf_chl/i.test(metin);
      const fiyatSayisi = (metin.match(FIYAT) || []).length;
      const veriVar = metin.includes("__single-search-result__PROPS");
      let sonuc = r.status === 200 && !engel ? (fiyatSayisi > 0 || veriVar ? "UYGUN" : "GIRDI_FIYAT_YOK") : "ENGELLI";
      return { ad, sonuc, durum: r.status, baslik, fiyatSayisi, veriVar };
    } catch (e) {
      return { ad, sonuc: "HATA", hata: String(e.message || e).slice(0, 80) };
    }
  }

  function satirYaz(kutu, s) {
    kutu.innerHTML = `<b>${simge[s.sonuc] || ""} ${s.ad}</b>: ${s.sonuc}
      <small>${s.durum !== undefined ? "durum: " + s.durum + " | fiyat sayısı: " + s.fiyatSayisi + (s.ad === "Trendyol" ? " | gömülü veri: " + (s.veriVar ? "var" : "yok") : "") : ""}
      ${s.baslik ? "<br>başlık: " + s.baslik : ""}${s.hata ? "<br>hata: " + s.hata : ""}</small>`;
  }

  document.getElementById("dugme").onclick = async () => {
    const q = encodeURIComponent(document.getElementById("q").value || "telefon");
    const kap = document.getElementById("sonuc");
    kap.innerHTML = "";
    ozet = "";
    const liste = SITELER(q);
    await Promise.all(liste.map(async ([ad, url]) => {
      const kutu = document.createElement("div");
      kutu.className = "satir";
      kutu.innerHTML = `<b>⏳ ${ad}</b>: deneniyor...`;
      kap.appendChild(kutu);
      const s = await dene(ad, url);
      satirYaz(kutu, s);
      ozet += `${ad}: ${s.sonuc} (durum ${s.durum ?? "-"}, fiyat ${s.fiyatSayisi ?? "-"}${s.ad === "Trendyol" ? ", veri " + (s.veriVar ? "var" : "yok") : ""}${s.hata ? ", hata " + s.hata : ""})\n`;
    }));
  };

  document.getElementById("kopyala").onclick = async () => {
    try { await navigator.clipboard.writeText(ozet || "Henüz test yok"); alert("Kopyalandı"); }
    catch (e) { alert("Kopyalanamadı, ekran görüntüsü al."); }
  };
</script>
</body>
</html>
