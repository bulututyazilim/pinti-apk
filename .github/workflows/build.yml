name: APK derle
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor projesini kur
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.pinti.app',appName:'Pinti',webDir:'www',server:{androidScheme:'https'},plugins:{CapacitorHttp:{enabled:true}}}))"
          npx cap add android
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug
      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Pinti APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
